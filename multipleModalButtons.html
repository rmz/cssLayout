<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lightbox Slideshow</title>
  <!-- Demos used:
 https://www.w3schools.com/howto/howto_css_modals.asp
 -->
  <style>
  .modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
}

.modal.active {
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-content {
  background: #fff;
  padding: 20px;
  border-radius: 5px;
  position: relative;
}

.close-btn {
  position: absolute;
  top: 10px;
  right: 15px;
  cursor: pointer;
  font-size: 20px;
}
</style>
</head>

<body>
  <!-- Trigger Buttons -->
<button class="open-modal-btn" data-target="modal-1">Open Modal 1</button>
<button class="open-modal-btn" data-target="modal-2">Open Modal 2</button>
<button class="open-modal-btn" data-target="modal-3">Open Modal 3</button>

<!-- Modals -->
<div id="modal-1" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <iframe src="slideshow1.html" title="Free in NYC" style="width:960px; height:800px; border:none;"></iframe>
    </iframe>
  </div>
</div>

<div id="modal-2" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <iframe src="slideshow2.html" title="Free in NYC" style="width:960px; height:800px; border:none;"></iframe>
    </iframe>
  </div>
</div>

<div id="modal-3" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <h2>Modal 3 Content</h2>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
  const openButtons = document.querySelectorAll(".open-modal-btn");
  const closeButtons = document.querySelectorAll(".close-btn");
  const modals = document.querySelectorAll(".modal");

  // Open modal
  openButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      const modalId = btn.dataset.target;
      const targetModal = document.getElementById(modalId);
      if (targetModal) {
        targetModal.classList.add("active");
      }
    });
  });

  // Close modal via close span
  closeButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      const modal = btn.closest(".modal");
      modal.classList.remove("active");
    });
  });

  // Close modal when clicking outside content area
  window.addEventListener("click", (e) => {
    modals.categoryModal = e.target;
    modals.forEach((modal) => {
      if (e.target === modal) {
        modal.classList.remove("active");
      }
    });
  });
});

</script>
</body>
</html>
