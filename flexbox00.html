<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: flex;
  background-color: pink;
  flex-wrap: wrap; /* This allows items to move to a new line */
}

.container div {
  background-color: #f1f1f1;
  border: 1px solid blue;
  margin: 10px;
  padding: 20px;
  font-size: 24px;
}
</style>
</head>
<body>

<h1>Create a Flex Container</h1>
<h3><a href="https://www.w3schools.com/css/css3_flexbox.asp" target="_blank">W3Schools Tutorial</h3>
<div class="container">
  <div>Item 1</div>
  <div>Item 2</div>
  <div>Item 3</div>
  <div>Item 4</div>
  <div>Item 5</div>
  <div>Item 6</div> 
  <div>Item 7</div>
  <div>Item 8</div>
  <div>Item 9</div> 
</div>

<p>Flexbox must have a parent element with the display property set to flex or inline-flex.</p>
<p>Direct child elements of the flex container automatically becomes flex items.</p>

</body>
</html>
